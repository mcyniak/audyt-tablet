<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Audyt</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="pasek">
    <button class="wstecz" id="wstecz" type="button" aria-label="Wstecz" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="tytuly">
      <h1 id="tytul">Audyt</h1>
      <p class="podtytul" id="podtytul"></p>
    </div>
    <span class="siec" id="siec" hidden>offline</span>
    <button class="ikona" id="odswiez" type="button" aria-label="Odśwież" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>
    </button>
  </header>

  <main>
    <!-- Logowanie -->
    <section class="ekran" id="ekran-start" hidden>
      <div class="powitanie">
        <img src="icons/icon.svg" alt="" width="88" height="88">
        <h2>Audyty w terenie</h2>
        <p>Zaloguj się firmowym kontem Google, żeby zobaczyć inwestycje.</p>
        <button type="button" class="glowny duzy" id="zaloguj">Zaloguj przez Google</button>
        <p class="blad" id="blad-logowania" hidden></p>
      </div>
    </section>

    <!-- Lista inwestycji -->
    <section class="ekran" id="ekran-inwestycje" hidden>
      <div class="szukaj"><input type="search" id="szukaj-inwestycji" placeholder="Szukaj inwestycji" autocomplete="off"></div>
      <p class="info" id="info-inwestycje" hidden></p>
      <div id="lista-inwestycji"></div>
    </section>

    <!-- Lista adresów -->
    <section class="ekran" id="ekran-adresy" hidden>
      <div class="szukaj">
        <input type="search" id="szukaj-adresu" placeholder="Szukaj adresu lub nazwiska" autocomplete="off">
        <div class="filtry" id="filtry"></div>
      </div>
      <div class="pasek-info" id="kolejka" hidden>
        <span id="kolejka-opis"></span>
        <button type="button" class="glowny" id="wyslij-kolejke">Wyślij</button>
      </div>
      <p class="info ostrzezenie" id="info-adresy" hidden></p>
      <ul class="lista" id="lista-adresow"></ul>
      <p class="pusto" id="brak-adresow" hidden>Nic nie pasuje do wyszukiwania.</p>
      <button type="button" class="link" id="pokaz-rezygnacje" hidden></button>
    </section>

    <!-- Protokół -->
    <section class="ekran" id="ekran-protokol" hidden>
      <div class="kontakt" id="kontakt"></div>
      <div class="narzedzia" id="narzedzia" role="toolbar" aria-label="Narzędzia">
        <div class="grupa">
          <button type="button" class="kolor" data-narzedzie="pioro" data-kolor="#1a3d8f" aria-pressed="true" aria-label="Pióro niebieskie"><span style="background:#1a3d8f"></span></button>
          <button type="button" class="kolor" data-narzedzie="pioro" data-kolor="#111111" aria-pressed="false" aria-label="Pióro czarne"><span style="background:#111111"></span></button>
          <button type="button" class="kolor" data-narzedzie="pioro" data-kolor="#c62828" aria-pressed="false" aria-label="Pióro czerwone"><span style="background:#c62828"></span></button>
          <button type="button" data-narzedzie="gumka" aria-pressed="false">Gumka</button>
        </div>
        <button type="button" id="cofnij" disabled>Cofnij</button>
        <button type="button" id="tryb-palca" aria-pressed="false" title="Dla tabletów bez rysika">Palcem: przewijam</button>
        <span class="odstep"></span>
        <button type="button" id="edytuj-dane">Dane</button>
        <button type="button" class="glowny" id="zapisz-protokol">Zapisz</button>
      </div>
      <div class="komunikat" id="komunikat" role="status" hidden></div>
      <div class="strony" id="strony"></div>
    </section>
  </main>

  <!-- Wybór protokołu, gdy pod adresem jest kilka instalacji -->
  <dialog id="dialog-typ" class="arkusz">
    <h2 id="dialog-typ-tytul"></h2>
    <div class="opcje" id="dialog-typ-opcje"></div>
    <form method="dialog"><button class="link">Anuluj</button></form>
  </dialog>

  <dialog id="dialog-dane">
    <form method="dialog" id="form-dane">
      <h2>Dane w protokole</h2>
      <p class="info">Wpisane z tabeli. Popraw, jeśli w terenie okaże się inaczej.</p>
      <label>Imię i nazwisko <input name="imie" autocomplete="off"></label>
      <label>Adres miejsca instalacji <input name="adres" autocomplete="off"></label>
      <label>Telefon <input name="telefon" inputmode="tel" autocomplete="off"></label>
      <label>E-mail <input name="email" type="email" autocomplete="off"></label>
      <label>Data <input name="data" type="date"></label>
      <div class="przyciski">
        <button type="submit" value="anuluj" class="duzy">Anuluj</button>
        <button type="submit" value="ok" class="duzy glowny">Zapisz dane</button>
      </div>
    </form>
  </dialog>

  <script src="vendor/xlsx.full.min.js"></script>
  <script src="vendor/fontkit.umd.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
