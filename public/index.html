<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0f12" media="(prefers-color-scheme: dark)">
  <title>Audyt</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preload" href="vendor/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="pasek" id="pasek">
    <button class="ikona-btn" id="wstecz" type="button" aria-label="Wstecz" hidden><span data-ikona="wstecz"></span></button>
    <div class="tytuly">
      <div class="tytul" id="tytul"></div>
      <div class="podtytul" id="podtytul"></div>
    </div>
    <span class="znacznik-offline" id="siec" hidden><span data-ikona="offline"></span>Offline</span>
    <button class="ikona-btn" id="odswiez" type="button" aria-label="Odśwież z Dysku" hidden><span data-ikona="odswiez"></span></button>
    <button class="btn btn-glowny" id="zapisz-protokol" type="button" hidden><span data-ikona="ok"></span>Zapisz</button>
  </header>

  <main>
    <!-- Logowanie -->
    <section class="ekran" id="ekran-start" hidden>
      <div class="powitanie">
        <img class="logo" src="icons/icon.svg" alt="" width="96" height="96">
        <h1>Audyty w terenie</h1>
        <p>Wybierz inwestycję i adres, wypełnij protokół rysikiem — trafi prosto na Dysk.</p>
        <button type="button" class="btn btn-google" id="zaloguj">
          <svg viewBox="0 0 48 48" aria-hidden="true" class="g"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          Zaloguj kontem firmowym
        </button>
        <p class="blad" id="blad-logowania" hidden></p>
      </div>
    </section>

    <!-- Inwestycje -->
    <section class="ekran" id="ekran-inwestycje" hidden>
      <div class="naglowek-ekranu">
        <h1 class="duzy-tytul">Inwestycje</h1>
      </div>
      <label class="szukaj">
        <span data-ikona="szukaj"></span>
        <input type="search" id="szukaj-inwestycji" placeholder="Szukaj inwestycji" autocomplete="off">
      </label>
      <p class="uwaga" id="info-inwestycje" hidden></p>
      <div id="lista-inwestycji"></div>
    </section>

    <!-- Adresy -->
    <section class="ekran" id="ekran-adresy" hidden>
      <div class="naglowek-ekranu">
        <h1 class="duzy-tytul" id="nazwa-inwestycji"></h1>
        <div class="podsumowanie" id="podsumowanie"></div>
      </div>
      <div class="przyklejone">
        <label class="szukaj">
          <span data-ikona="szukaj"></span>
          <input type="search" id="szukaj-adresu" placeholder="Szukaj adresu lub nazwiska" autocomplete="off">
        </label>
        <div class="segmenty" id="filtry"></div>
      </div>
      <div class="baner" id="kolejka" hidden>
        <span data-ikona="wysylka"></span>
        <span class="baner-tekst" id="kolejka-opis"></span>
        <button type="button" class="btn btn-maly btn-glowny" id="wyslij-kolejke">Wyślij</button>
      </div>
      <p class="uwaga" id="info-adresy" hidden></p>
      <ul class="lista" id="lista-adresow"></ul>
      <p class="pusto" id="brak-adresow" hidden>Nic nie pasuje do wyszukiwania.</p>
      <button type="button" class="btn-link" id="pokaz-rezygnacje" hidden></button>
    </section>

    <!-- Protokół -->
    <section class="ekran" id="ekran-protokol" hidden>
      <div class="kontakt" id="kontakt"></div>
      <div class="uwaga" id="komunikat" role="status" hidden></div>
      <div class="strony" id="strony"></div>

      <div class="narzedzia" id="narzedzia" role="toolbar" aria-label="Narzędzia">
        <button type="button" class="kolor" data-narzedzie="pioro" data-kolor="#1a3d8f" aria-pressed="true" aria-label="Pióro niebieskie"><span style="--k:#1a3d8f"></span></button>
        <button type="button" class="kolor" data-narzedzie="pioro" data-kolor="#111111" aria-pressed="false" aria-label="Pióro czarne"><span style="--k:#111111"></span></button>
        <button type="button" class="kolor" data-narzedzie="pioro" data-kolor="#c62828" aria-pressed="false" aria-label="Pióro czerwone"><span style="--k:#c62828"></span></button>
        <span class="separator"></span>
        <button type="button" class="narzedzie" data-narzedzie="gumka" aria-pressed="false" aria-label="Gumka" title="Gumka"><span data-ikona="gumka"></span></button>
        <button type="button" class="narzedzie" id="cofnij" disabled aria-label="Cofnij" title="Cofnij"><span data-ikona="cofnij"></span></button>
        <span class="separator"></span>
        <button type="button" class="narzedzie" id="tryb-palca" aria-pressed="false" aria-label="Pisanie palcem" title="Pisanie palcem (bez rysika)"><span data-ikona="dlon"></span></button>
        <button type="button" class="narzedzie" id="edytuj-dane" aria-label="Dane w protokole" title="Dane w protokole"><span data-ikona="dane"></span></button>
      </div>
    </section>
  </main>

  <div class="toasty" id="toasty" aria-live="polite"></div>

  <!-- Wybór protokołu, gdy pod adresem jest kilka instalacji -->
  <dialog id="dialog-typ" class="arkusz">
    <div class="uchwyt"></div>
    <h2 id="dialog-typ-tytul"></h2>
    <p class="arkusz-opis">Który protokół wypełniasz?</p>
    <div class="opcje" id="dialog-typ-opcje"></div>
    <form method="dialog"><button class="btn btn-szary btn-pelny">Anuluj</button></form>
  </dialog>

  <dialog id="dialog-dane" class="arkusz">
    <div class="uchwyt"></div>
    <form method="dialog" id="form-dane">
      <h2>Dane w protokole</h2>
      <p class="arkusz-opis">Wpisane z tabeli. Popraw, jeśli w terenie okaże się inaczej.</p>
      <label class="pole"><span>Imię i nazwisko</span><input name="imie" autocomplete="off"></label>
      <label class="pole"><span>Adres miejsca instalacji</span><input name="adres" autocomplete="off"></label>
      <div class="pola-obok">
        <label class="pole"><span>Telefon</span><input name="telefon" inputmode="tel" autocomplete="off"></label>
        <label class="pole"><span>Data</span><input name="data" type="date"></label>
      </div>
      <label class="pole"><span>E-mail</span><input name="email" type="email" autocomplete="off"></label>
      <div class="przyciski">
        <button type="submit" value="anuluj" class="btn btn-szary">Anuluj</button>
        <button type="submit" value="ok" class="btn btn-glowny">Zapisz dane</button>
      </div>
    </form>
  </dialog>

  <script src="vendor/xlsx.full.min.js"></script>
  <script src="vendor/fontkit.umd.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
