# Publikacja aplikacji (folder public/) na GitHub Pages przy każdym pushu do main.
# Biblioteki są już w public/vendor (npm run vendor), więc nic nie budujemy.
name: Publikacja na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Osobne zadania: deploy-pages w tym samym zadaniu co upload czasem nie widzi
  # jeszcze artefaktu („No artifacts named github-pages”).
  budowa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  publikacja:
    needs: budowa
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.wdrozenie.outputs.page_url }}
    steps:
      - id: wdrozenie
        uses: actions/deploy-pages@v4
